<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f1">
    <meta name="description" content="A calm, simple to-do list that keeps your tasks saved in your browser.">
    <title>Daylight — To-do list</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #25332e;
        background: #f6f5f1;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --green: #2e725b;
        --muted: #84908a;
        --line: #e8e9e3;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 40px 18px;
        background: radial-gradient(ellipse at 50% 4%, #e8f0df 0, transparent 36%), #f6f5f1;
      }
      .app { width: min(100%, 600px); margin: 0 auto; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
      .brand { display: flex; align-items: center; gap: 11px; color: #2c4037; font-weight: 750; letter-spacing: -.02em; }
      .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 14px; color: white; background: var(--green); font-size: 1.05rem; }
      .today { color: var(--muted); font-size: .82rem; }
      .intro { margin-bottom: 24px; }
      .eyebrow { margin: 0 0 8px; color: var(--green); font-size: .73rem; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 0; color: #27382f; font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 650; letter-spacing: -.06em; }
      .subtitle { margin: 9px 0 0; color: var(--muted); font-size: .96rem; }
      .card { padding: 22px; border: 1px solid #ffffff; border-radius: 24px; background: #fffefa; box-shadow: 0 20px 60px #3946380c; }
      .form { display: flex; gap: 10px; }
      .task-input { min-width: 0; min-height: 52px; flex: 1; padding: 0 16px; border: 1px solid #e6e9e2; border-radius: 15px; outline: none; color: #25332e; background: #fbfcf9; font: inherit; font-size: .95rem; transition: border-color .16s ease, box-shadow .16s ease; }
      .task-input::placeholder { color: #a3ada6; }
      .task-input:focus { border-color: #77aa91; box-shadow: 0 0 0 4px #2e725b13; }
      .add-button { min-width: 92px; padding: 0 18px; border: 0; border-radius: 15px; color: white; background: var(--green); font: inherit; font-weight: 700; cursor: pointer; transition: transform .16s ease, background .16s ease; }
      .add-button:hover { transform: translateY(-1px); background: #245c48; }
      button:focus-visible { outline: 3px solid #2e725b44; outline-offset: 3px; }
      .notice { min-height: 22px; margin: 8px 2px 0; color: #ad584a; font-size: .8rem; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 17px 3px 13px; }
      .filters { display: flex; gap: 5px; }
      .filter { padding: 8px 11px; border: 0; border-radius: 10px; color: #859088; background: transparent; font: inherit; font-size: .8rem; font-weight: 650; cursor: pointer; }
      .filter[aria-pressed="true"] { color: var(--green); background: #e9f2eb; }
      .clear-button { padding: 8px 0 8px 8px; border: 0; color: #87918a; background: none; font: inherit; font-size: .77rem; cursor: pointer; }
      .clear-button:hover { color: #a54f42; }
      .tasks { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
      .task { display: flex; align-items: center; gap: 13px; min-height: 58px; padding: 10px 8px; border-top: 1px solid var(--line); animation: appear .2s ease-out; }
      .check { display: grid; width: 22px; height: 22px; flex: 0 0 22px; place-items: center; border: 1.5px solid #cbd4cc; border-radius: 8px; color: white; background: transparent; cursor: pointer; }
      .task.done .check { border-color: var(--green); background: var(--green); }
      .task.done .check::after { content: "✓"; font-size: .82rem; font-weight: 800; }
      .task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; color: #3c4942; font-size: .93rem; line-height: 1.5; }
      .task.done .task-text { color: #a0aaa2; text-decoration: line-through; text-decoration-color: #aab4ab; }
      .delete-button { display: grid; width: 34px; height: 34px; place-items: center; border: 0; border-radius: 10px; color: #98a19b; background: transparent; font-size: 1.2rem; cursor: pointer; opacity: 0; }
      .task:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
      .delete-button:hover { color: #a54f42; background: #fbefec; }
      .empty { padding: 34px 12px 30px; color: #929d95; text-align: center; font-size: .9rem; }
      .empty-icon { display: block; margin-bottom: 9px; font-size: 1.7rem; }
      .footer { display: flex; justify-content: space-between; margin: 17px 4px 0; color: #9ba49d; font-size: .77rem; }
      @keyframes appear { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 450px) {
        body { padding: 26px 14px; }
        .header { margin-bottom: 38px; }
        .card { padding: 16px; }
        .add-button { min-width: 78px; padding: 0 13px; }
        .filters { gap: 0; }
        .filter { padding: 8px; }
        .delete-button { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> daylight</div>
        <time class="today" id="today"></time>
      </header>
      <section class="intro">
        <p class="eyebrow">A little more focus</p>
        <h1>Make room for today.</h1>
        <p class="subtitle">One small step at a time. You've got this.</p>
      </section>
      <section class="card" aria-label="Your tasks">
        <form class="form" id="task-form">
          <label for="task-input" class="visually-hidden">Add a task</label>
          <input class="task-input" id="task-input" maxlength="160" placeholder="What would you like to do?" autocomplete="off">
          <button class="add-button" type="submit">Add task <span aria-hidden="true">+</span></button>
        </form>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="done" aria-pressed="false">Done</button>
          </div>
          <button class="clear-button" id="clear-done" type="button">Clear completed</button>
        </div>
        <ul class="tasks" id="tasks"></ul>
        <div class="empty" id="empty" hidden><span class="empty-icon" aria-hidden="true">☀</span><span id="empty-text">A fresh start. Add your first task above.</span></div>
        <footer class="footer"><span id="remaining">0 tasks left</span><span>Saved on this device</span></footer>
      </section>
    </main>
    <script>
      const STORAGE_KEY = "daylight-tasks-v1";
      const list = document.querySelector("#tasks");
      const input = document.querySelector("#task-input");
      const notice = document.querySelector("#notice");
      let filter = "all";
      let tasks = [];

      document.querySelector("#today").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "short", day: "numeric"
      }).format(new Date());

      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (Array.isArray(stored)) {
          tasks = stored.filter((task) =>
            task && typeof task.id === "string" && typeof task.text === "string" &&
            typeof task.done === "boolean"
          );
        }
      } catch {
        notice.textContent = "Your saved tasks could not be read. New tasks can still be added.";
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          notice.textContent = "";
        } catch {
          notice.textContent = "This browser could not save your changes. They may not persist after closing.";
        }
      }

      function render() {
        list.replaceChildren();
        const shown = tasks.filter((task) =>
          filter === "all" || (filter === "active" && !task.done) || (filter === "done" && task.done)
        );
        for (const task of shown) {
          const item = document.createElement("li");
          item.className = `task${task.done ? " done" : ""}`;
          const toggle = document.createElement("button");
          toggle.className = "check";
          toggle.type = "button";
          toggle.setAttribute("aria-label", task.done ? `Mark ${task.text} active` : `Complete ${task.text}`);
          toggle.setAttribute("aria-pressed", String(task.done));
          toggle.addEventListener("click", () => {
            task.done = !task.done;
            save();
            render();
          });
          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;
          const remove = document.createElement("button");
          remove.className = "delete-button";
          remove.type = "button";
          remove.setAttribute("aria-label", `Delete ${task.text}`);
          remove.textContent = "×";
          remove.addEventListener("click", () => {
            tasks = tasks.filter((current) => current.id !== task.id);
            save();
            render();
          });
          item.append(toggle, text, remove);
          list.append(item);
        }

        const empty = document.querySelector("#empty");
        empty.hidden = shown.length > 0;
        document.querySelector("#empty-text").textContent = tasks.length === 0
          ? "A fresh start. Add your first task above."
          : filter === "active" ? "All caught up. Nothing left to do."
            : filter === "done" ? "No completed tasks yet." : "No tasks match this view.";
        const remaining = tasks.filter((task) => !task.done).length;
        document.querySelector("#remaining").textContent =
          `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
        document.querySelectorAll(".filter").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });
      }

      document.querySelector("#task-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          notice.textContent = "Write a task first, then add it to your list.";
          input.focus();
          return;
        }
        tasks.unshift({ id: crypto.randomUUID(), text, done: false });
        input.value = "";
        save();
        render();
        input.focus();
      });

      document.querySelectorAll(".filter").forEach((button) => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      document.querySelector("#clear-done").addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.done);
        save();
        render();
      });

      render();
    </script>
  </body>
</html>
